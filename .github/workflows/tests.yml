name: MVP tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --no-check-publish
      - run: composer test
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: yellow_goose_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_sqlite, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/run.php
        env:
          GASKA_TEST_MYSQL: '1'
          MYSQL_TEST_DATABASE: yellow_goose_test
          MYSQL_TEST_PASSWORD: test-password
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none
      # setup-php already installs and selects the matching CGI binary.
      # Its cached PHP builds do not require the runner's apt sources to contain PHP 8.5.
      - name: Verify PHP CGI runtime
        run: |
          php-cgi --version
          php-cgi -m | grep -Fx pdo_sqlite
          php-cgi -m | grep -Fx mbstring
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run verify
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
