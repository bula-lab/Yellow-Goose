name: MVP tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --no-check-publish
      - run: composer test
      - run: python3 scripts/check-packages.py
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: yellow_goose_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, pdo_sqlite, mbstring, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php tests/run.php
        env:
          GASKA_TEST_MYSQL: '1'
          MYSQL_TEST_DATABASE: yellow_goose_test
          MYSQL_TEST_PASSWORD: test-password
      - run: python3 tests/migrations.py
        env:
          GASKA_TEST_MYSQL: '1'
          MYSQL_TEST_DATABASE: yellow_goose_test
          MYSQL_TEST_PASSWORD: test-password
      - run: php tests/integration-mysql.php
        env:
          YG_INTEGRATION_MYSQL: '1'
          MYSQL_TEST_DATABASE: yellow_goose_test
          MYSQL_TEST_PASSWORD: test-password
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PHP V8Js and browser test environment
        run: docker build --target test -t yellow-goose-test -f tests/docker/V8Js.Dockerfile .
      - name: Clean install, verification and Chromium E2E
        run: |
          docker run --rm --shm-size=1g -v "$PWD:/app" yellow-goose-test sh -ec '
            composer install --no-interaction --prefer-dist
            npm ci
            GASKA_PACKAGE_BROWSER=1 npm run verify:all
          '
      - name: Verify SSR and CGI without Node or child-process execution
        run: |
          docker build --target runtime -t yellow-goose-runtime -f tests/docker/V8Js.Dockerfile .
          docker run --rm -v "$PWD:/app:ro" yellow-goose-runtime sh -ec '
            ! command -v node
            php -d disable_functions=proc_open,popen,exec,shell_exec,system,passthru tests/ssr.php
            python3 tests/cgi.py
            python3 tests/modules-cgi.py
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
